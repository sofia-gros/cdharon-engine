engine:
  name: Charon Engine
  author: sofia-gros
  version: 1.0.0
  description: Let's you create 2D sandbox games with ease.
  window:
    width: 1280
    height: 720
    resizable: false
    fullscreen: false
    vsync: true
    framerate-target: 144
  debug:
    show_fps: true
    show_colliders: true
    show_grid: true
    grid_size: 50
    grid_color: 8421504
    grid_opacity: 0.5
game:
  player:
    speed: 200.0
    jump_force: 500.0
    gravity: 9.8
    max_health: 100
    max_stamina: 100
  camera:
    speed: 200.0
